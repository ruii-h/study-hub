var(--gold);font-size:10px;letter-spacing:.13em;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 45px rgba(0,0,0,.3);padding:16px}.stage{min-height:390px;display:flex;align-items:center;justify-content:center;overflow:auto;background:rgba(5,13,28,.55)}.status{min-height:78px;padding:12px;border-left:4px solid var(--gold);background:rgba(255,179,64,.08);font-size:12.5px;line-height:1.6;margin-bottom:12px}.rule{border-left-color:var(--green);background:rgba(46,230,160,.08)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.controls input{width:100px}.item{min-width:68px;height:54px;padding:0 10px;display:grid;place-items:center;border:2px solid var(--cyan);border-radius:9px;background:rgba(63,208,255,.12);font-size:17px;font-weight:800;position:relative}.item.active{border-color:var(--gold);background:rgba(255,179,64,.15);box-shadow:0 0 18px rgba(255,179,64,.35)}.stack{width:180px;min-height:285px;border:4px solid rgba(143,168,204,.5);border-top:0;border-radius:0 0 14px 14px;padding:8px;display:flex;flex-direction:column-reverse;gap:6px}.stack .item{width:100%}.row,.tokens{display:flex;align-items:center;gap:7px;min-width:max-content}.queue{min-width:590px;padding:12px;border-top:4px solid rgba(143,168,204,.45);border-bottom:4px solid rgba(143,168,204,.45)}.label{text-align:center;color:var(--gold);font-size:10px;letter-spacing:.1em;margin:6px}.empty{color:var(--dim);font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:25px;width:100%}.mini{text-align:center;color:var(--cyan);font-weight:800;margin-bottom:12px}.token{width:43px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:rgba(10,30,62,.85);font-weight:800}.token.current{border-color:var(--gold);color:var(--gold);transform:translateY(-5px)}.callstack{width:285px;min-height:300px;border:3px solid rgba(143,168,204,.45);border-top:0;padding:8px;display:flex;flex-direction:column-reverse;gap:7px}.frame{padding:11px;border:1px solid var(--cyan);border-radius:8px;background:rgba(63,208,255,.09);font-size:12px}.frame.active{border-color:var(--gold);background:rgba(255,179,64,.13)}.flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.box{padding:16px;border:1px solid var(--line);border-radius:10px;background:rgba(10,30,62,.85);text-align:center;min-width:145px}.box b{display:block;color:var(--cyan);margin-bottom:7px}.arrow{font-size:23px;color:var(--gold)}.array{display:flex;min-width:max-content}.cell{width:67px;height:62px;border:1px solid var(--line);background:rgba(10,30,62,.85);display:grid;place-items:center;position:relative;font-size:17px;font-weight:800;transition:.25s}.cell.move-right{border-color:var(--gold);transform:translateX(7px);background:rgba(255,179,64,.13)}.cell.move-left{border-color:var(--gold);transform:translateX(-7px);background:rgba(255,179,64,.13)}.cell.out{opacity:.2}.cell.mid{border:2px solid var(--gold);background:rgba(255,179,64,.16);box-shadow:0 0 18px rgba(255,179,64,.35)}.idx{position:absolute;bottom:-20px;color:var(--dim);font-size:9px}.big{text-align:center;color:var(--gold);font-size:23px;margin-top:35px}.check{text-align:center;font-size:27px;color:var(--green);margin-top:24px}.comparison{width:100%;border-collapse:collapse;font-size:12px}.comparison th,.comparison td{padding:11px;border-bottom:1px solid var(--line);text-align:center}.comparison th{color:var(--cyan)}.comparison tr.active td{background:rgba(255,179,64,.11)}.priority{font-size:9px;color:var(--gold);position:absolute;bottom:-17px;white-space:nowrap}.code{white-space:pre-wrap;background:#050d1c;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:11.5px;line-height:1.55;color:#cfe0ff}.access-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}.access-card{padding:14px;border:1px solid var(- <main class="page"><header class="hero"><h1>LINEAR DATA STRUCTURES VISUAL LAB</h1><p>PREDICT FIRST · OPERATE ONE STEP AT A TIME · EXPLAIN WHAT CHANGED</p></header><nav class="nav" id="nav"></nav><div id="content"></div></main>
<script>
"use strict";const $=id=>document.getElementById(id),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const modules=[
['ADT and implementation','FOUNDATION','Separate what a structure does from how it stores data',`<div class="flow"><div class="box"><b>CLIENT CODE</b>s.push("kiwi")</div><span class="arrow">→</span><div class="box"><b>STACK ADT</b>push · pop · peek</div><span class="arrow">→</span><div class="box" id="adtImpl"><b>HIDDEN STORAGE</b>Python list</div></div>`,`<div class="status" id="adtStatus">The client asks for an operation without seeing the storage details.</div><div class="controls"><button onclick="adt('Python list')">Python list</button><button onclick="adt('Linked nodes')">Linked nodes</button></div><div class="status rule"><b>Rule:</b> operations stay the same when the hidden implementation changes.</div>`],
['Which item is accessible?','ACCESS RULE','Identify the one item each linear structure exposes',`<div class="access-grid" id="accessGrid"><div class="access-card"><h3>LIST · choose an index</h3><div class="tokens"><span class="token">10</span><span class="token">20</span><span class="token">30</span></div></div><div class="access-card"><h3>STACK · top only</h3><div class="tokens"><span class="token">A</span><span class="token">B</span><span class="token">C</span></div></div><div class="access-card"><h3>QUEUE · head only</h3><div class="tokens"><span class="token">A</span><span class="token">B</span><span class="token">C</span></div></div><div class="access-card"><h3>PRIORITY QUEUE · highest priority</h3><div class="tokens"><span class="token">P3</span><span class="token">P1</span><span class="token">P2</span></div></div></div>`,`<div class="status" id="accessStatus">Choose a structure. The gold item is the one available through peek or removal.</div><div class="controls"><button onclick="accessShow(0)">List index 1</button><button onclick="accessShow(1)">Stack</button><button onclick="accessShow(2)">Queue</button><button onclick="accessShow(3)">Priority queue</button></div><div class="status rule"><b>Key question:</b> which item does the structure allow us to access next?</div>`],
['Stack playground','LIFO','Push, peek, and pop always use the top',`<div><div class="label">TOP</div><div class="stack" id="stackBox"></div><div class="label">BOTTOM</div></div>`,`<div class="status" id="stackStatus"></div><div class="controls"><input id="stackInput" value="kiwi"><button class="primary" onclick="stackPush()">Push</button><button onclick="stackPeek()">Peek</button><button onclick="stackPop()">Pop</button><button onclick="stackReset()">Reset</button></div><div class="status rule"><b>LIFO:</b> the last item pushed is the first item popped.</div>`],
['Queue playground','FIFO','Enqueue at the tail and dequeue at the head',`<div class="row"><span class="label">HEAD<br>leaves →</span><div class="queue row" id="queueBox"></div><span class="label">← TAIL<br>enters</span></div>`,`<div class="status" id="queueStatus"></div><div class="controls"><input id="queueInput" value="kiwi"><button class="primary" onclick="queueAdd()">Enqueue</button><button onclick="queuePeek()">Peek</button><button onclick="queueRemove()">Dequeue</button><button onclick="queueReset()">Reset</button></div><div class="status rule"><b>FIFO:</b> the first item enqueued is the first item dequeued.</div>`],
['Stack versus queue','COMPARE','Use the same arrivals and observe different removal orders',`<div class="split"><div><div class="mini">STACK · TOP ON RIGHT</div><div class="tokens" id="compareStack"></div></div><div><div class="mini">QUEUE · HEAD ON LEFT</div><div class="tokens" id="compareQueue"></div></div></div>`,`<div class="status" id="compareStatus"></div><div class="controls"><button class="primary" onclick="compareRemove()">Remove from both</button><button onclick="compareReset()">Reset</button></div><div class="status rule" id="compareRule">Predict the first pair before clicking.</div>`],
['Balanced braces','STACK APPLICATION','Check order as well as the number of braces',`<div style="width:100%"><div class="tokens" id="braceChars"></div><div class="mini" style="margin-top:35px">UNMATCHED OPENING BRACES</div><div class="tokens" id="braceStack"></div></div>`,`<div class="controls"><select id="braceSelect" onchange="braceLoad()"><option>a{b{c}d}</option><option>ab{{c}d</option><option>a}b{cd</option></select></div><div class="status" id="braceStatus"></div><div class="controls"><button class="primary" onclick="braceStep()">Next character</button><button onclick="braceLoad()">Reset</button></div><div class="status rule"><b>Two checks:</b> never pop an empty stack; finish with an empty stack.</div>`],
['Function call stack','CALL FRAMES','See callers pause and resume in reverse order',`<div><div class="label">TOP · ACTIVE CALL</div><div class="callstack" id="callBox"></div></div>`,`<pre class="code">f1(n): return 2 * f2(n)<br>f2(n): return 2 * f3(n)<br>f3(n): return 2 * f4(n)<br>f4(n): return n</pre><div class="status" id="callStatus"></div><div class="controls"><button class="primary" onclick="callStep()">Next step</button><button onclick="callReset()">Reset</button></div><div class="status rule"><b>Rule:</b> the newest call completes first. Paused calls keep their own local state.</div>`],
['Recursion and explicit stack','FIBONACCI(4)','Store recursive parameters on a stack',`<div style="width:100%"><div class="mini">PENDING PARAMETERS · TOP ON RIGHT</div><div class="tokens" id="fibStack"></div><div class="big" id="fibResult"></div></div>`,`<div class="status" id="fibStatus"></div><div class="controls"><button class="primary" onclick="fibStep()">Process top</button><button onclick="fibReset()">Reset</button></div><div class="status rule"><b>Push order:</b> push n−2 first, then n−1, so n−1 is processed first.</div>`],
['Recursive sum with a stack','SUM(5)','Follow the calls down, then add returned values on the way up',`<div style="width:100%"><div class="mini">CALL FRAMES · TOP ON RIGHT</div><div class="tokens" id="sumFrames"></div><div class="big" id="sumResult"></div></div>`,`<div class="status" id="sumStatus"></div><div class="controls"><button class="primary" onclick="sumStep()">Next step</button><button onclick="sumReset()">Reset</button></div><div class="status rule"><b>Rule:</b> push smaller calls until the base case; then pop and add while returning.</div>`],
['Recursive factorial with a stack','FACTORIAL(5)','Follow the calls down, then multiply returned values on the way up',`<div style="width:100%"><div class="mini">CALL FRAMES · TOP ON RIGHT</div><div class="tokens" id="factorialFrames"></div><div class="big" id="factorialResult"></div></div>`,`<div class="status" id="factorialStatus"></div><div class="controls"><button class="primary" onclick="factorialStep()">Next step</button><button onclick="factorialReset()">Reset</button></div><div class="status rule"><b>Rule:</b> each paused frame remembers n; pop and multiply only after reaching factorial(1).</div>`],
['Palindrome checker','STACK + QUEUE','Read the same word from opposite directions',`<div style="width:100%"><div class="split"><div><div class="mini">STACK POPS FROM RIGHT</div><div class="tokens" id="palStack"></div></div><div><div class="mini">QUEUE DEQUEUES FROM LEFT</div><div class="tokens" id="palQueue"></div></div></div><div class="check" id="palCheck">?</div></div>`,`<div class="controls"><select id="palSelect" onchange="palLoad()"><option>madam</option><option>radar</option><option>house</option></select></div><div class="status" id="palStatus"></div><div class="controls"><button class="primary" onclick="palStep()">Compare next pair</button><button onclick="palLoad()">Reset</button></div><div class="status rule"><b>Palindrome:</b> every popped letter equals the dequeued letter.</div>`],
['List shifting cost','COMPLEXITY','Connect element movement to O(n)',`<div><div class="array" id="shiftArray"></div><div class="big" id="shiftCount"></div></div>`,`<div class="status" id="shiftStatus"></div><div class="controls"><button class="primary" onclick="shiftDemo('add')">Insert at index 0</button><button onclick="shiftDemo('del')">Delete index 0</button><button onclick="shiftDemo('end')">Append at end</button><button onclick="shiftReset()">Reset</button></div><div class="status rule"><b>Rule:</b> moving about n items costs O(n). No shifting gives O(1) on average.</div>`],
['Priority queue','HIGHER PRIORITY FIRST','Use priority instead of ordinary arrival order',`<div style="width:100%"><div class="mini">LOGICAL DEQUEUE ORDER · NEXT ITEM ON LEFT</div><div class="row" id="pqBox"></div></div>`,`<div class="status" id="pqStatus"></div><div class="controls"><input id="pqName" value="Task A"><input id="pqPriority" type="number" value="3" min="1" max="9"><button class="primary" onclick="pqAdd()">Enqueue</button><button onclick="pqPeek()">Peek</button><button onclick="pqRemove()">Dequeue</button><button onclick="pqReset()">Reset</button></div><div class="status rule"><b>Here:</b> a smaller number means higher priority. Arrival order breaks ties.</div>`],
['Priority queue implementations','BIG-O','See where each implementation spends work',`<table class="comparison" id="pqTable"><thead><tr><th>Implementation</th><th>Enqueue</th><th>Peek</th><th>Dequeue</th></tr></thead><tbody><tr><td>Unsorted list</td><td>O(1)</td><td>O(1)*</td><td>O(n)</td></tr><tr><td>Reverse-sorted list</td><td>O(n)</td><td>O(1)</td><td>O(1)</td></tr><tr><td>Balanced BST average</td><td>O(log n)</td><td>O(1)*</td><td>O(log n)</td></tr></tbody></table>`,`<div class="status" id="implStatus"></div><div class="controls"><button onclick="implShow(0)">Unsorted</button><button onclick="implShow(1)">Sorted</button><button onclick="implShow(2)">BST</button></div><div class="status rule">*O(1) peek assumes a saved reference to the minimum. Reverse sorting keeps the minimum at the list end, where removal needs no shift.</div>`],
['Queue using two stacks','CHALLENGE','See how one transfer reverses the order',`<div class="split"><div><div class="mini">IN STACK · TOP RIGHT</div><div class="tokens" id="twoIn"></div></div><div><div class="mini">OUT STACK · TOP RIGHT</div><div class="tokens" id="twoOut"></div></div></div>`,`<div class="status" id="twoStatus"></div><div class="controls"><button onclick="twoEnqueue()">Enqueue next</button><button class="primary" onclick="twoDequeue()">Dequeue one</button><button onclick="twoReset()">Reset</button></div><div class="status rule"><b>Rule:</b> enqueue pushes onto IN. For dequeue, transfer only when OUT is empty.</div>`]
];
const details=[
{p:'An abstract data type (ADT) describes the values and operations that client code may use. It hides the storage and implementation details.',o:'<ul><li><span class="term">Interface:</span> the operation names, inputs, and returned results.</li><li><span class="term">Implementation:</span> the hidden code and storage used to perform those operations.</li><li><span class="term">Benefit:</span> client code does not change when one correct implementation replaces another.</li></ul>',c:'CLIENT: call s.push("kiwi")<br>ADT: promise to place kiwi on top<br>IMPLEMENTATION: update a list or linked nodes<br>RESULT: the visible stack behaviour is the same'},
{p:'Different data structures control which item may be examined or removed next. This access rule is the main difference between them.',o:'<ul><li><span class="term">List:</span> choose any valid index.</li><li><span class="term">Stack:</span> access the top.</li><li><span class="term">Queue:</span> access the head.</li><li><span class="term">Priority queue:</span> access the highest-priority item.</li></ul>',c:'Before choosing a structure, ask:<br>1. Which item must be available next?<br>2. Does arrival order matter?<br>3. Does priority matter?'},
{p:'A stack stores items in Last-In, First-Out order. Think of plates: only the top plate can be used.',o:'<ul><li><span class="term">push(x):</span> add x to the top.</li><li><span class="term">peek():</span> return the top item without removing it.</li><li><span class="term">pop():</span> return and remove the top item.</li><li><span class="term">count():</span> return the number of items.</li></ul>',c:'push(x):<br>    place x on top<br><br>peek():<br>    if empty: report underflow<br>    return top item<br><br>pop():<br>    if empty: report underflow<br>    remove and return top item'},
{p:'A queue serves items in First-In, First-Out order. New arrivals join the tail; service happens at the head.',o:'<ul><li><span class="term">enqueue(x):</span> add x at the tail.</li><li><span class="term">peek():</span> return the head without removing it.</li><li><span class="term">dequeue():</span> return and remove the head.</li><li><span class="term">count():</span> return the number of items.</li></ul>',c:'enqueue(x):<br>    place x at tail<br><br>peek():<br>    if empty: report underflow<br>    return head item<br><br>dequeue():<br>    if empty: report underflow<br>    remove and return head item'},
{p:'This comparison inserts A, B, then C into both structures. The data are identical; only the access rule changes.',o:'<ol><li>A enters first, then B, then C.</li><li>Stack pop chooses the newest item: C.</li><li>Queue dequeue chooses the oldest item: A.</li><li>Continue to obtain C,B,A versus A,B,C.</li></ol>',c:'for x in [A, B, C]:<br>    stack.push(x)<br>    queue.enqueue(x)<br><br>while items remain:<br>    display stack.pop()<br>    display queue.dequeue()'},
{p:'Problem: decide whether every closing brace has an earlier unmatched opening brace and no opening brace remains at the end.',o:'<ol><li>Scan left to right.</li><li>For {, push it.</li><li>For }, return False if the stack is empty; otherwise pop.</li><li>After the scan, return True only if the stack is empty.</li></ol>',c:'check_braces(text):<br>    s = new Stack<br>    for ch in text:<br>        if ch == "{": s.push(ch)<br>        else if ch == "}":<br>            if s is empty: return False<br>            s.pop()<br>    return s is empty'},
{p:'Problem: remember unfinished function calls. A caller pauses at the call line until the called function returns a value.',o:'<ol><li>Calling a function pushes a new frame.</li><li>The new top frame becomes active.</li><li>Older frames wait with their local variables.</li><li>Returning pops the active frame and resumes its caller.</li></ol>',c:'f1(n): return 2 * f2(n)<br>f2(n): return 2 * f3(n)<br>f3(n): return 2 * f4(n)<br>f4(n): return n<br><br>f1(5) returns 2 × 2 × 2 × 5 = 40'},
{p:'Problem: compute Fibonacci without recursive function calls. An explicit stack stores parameters that still need processing.',o:'<ol><li>Push n.</li><li>Pop the top value.</li><li>For 0 or 1, add the base-case result.</li><li>Otherwise push n−2 first, then n−1.</li><li>Stop when the stack is empty.</li></ol>',c:'fib_stack(n):<br>    s.push(n); result = 0<br>    while s is not empty:<br>        current = s.pop()<br>        if current <= 1: result += current<br>        else:<br>            s.push(current - 2)<br>            s.push(current - 1)<br>    return result'},
{p:'Problem: compute 1 + 2 + … + n. In sum(5), each call pauses while it waits for the smaller call to return. The stack frame stores that paused call’s value of n.',o:'<ol><li><b>Going down:</b> push sum(5), sum(4), … until sum(0).</li><li><b>Base case:</b> sum(0) returns 0 without making another call.</li><li><b>Coming up:</b> pop sum(1) and calculate 1 + 0 = 1.</li><li>Continue: 2 + 1 = 3, 3 + 3 = 6, 4 + 6 = 10, and 5 + 10 = 15.</li><li>The first call finishes last because it is at the bottom of the stack.</li></ol>',c:'recursive_sum(n):<br>    if n == 0: return 0<br>    return n + recursive_sum(n - 1)<br><br>sum_with_stack(n):<br>    s = new Stack<br>    while n >= 0:<br>        s.push(n); n = n - 1<br>    result = s.pop()       # base value 0<br>    while s is not empty:<br>        result = s.pop() + result<br>    return result'},
{p:'Problem: compute n! = n × (n−1) × … × 1. In factorial(5), a frame cannot multiply yet because it must first receive the result of the smaller factorial call.',o:'<ol><li><b>Going down:</b> push factorial(5), factorial(4), … until factorial(1).</li><li><b>Base case:</b> factorial(1) returns 1.</li><li><b>Coming up:</b> pop factorial(2) and calculate 2 × 1 = 2.</li><li>Continue: 3 × 2 = 6, 4 × 6 = 24, and 5 × 24 = 120.</li><li>Each multiplication uses the n saved in the popped frame and the value returned from above it.</li></ol>',c:'factorial(n):<br>    if n <= 1: return 1<br>    return n * factorial(n - 1)<br><br>factorial_with_stack(n):<br>    s = new Stack<br>    while n >= 1:<br>        s.push(n); n = n - 1<br>    result = 1<br>    while s is not empty:<br>        result = s.pop() * result<br>    return result'},
{p:'Problem: decide whether a word reads identically from left to right and right to left.',o:'<ol><li>Insert every letter into a stack and queue.</li><li>Stack pop reads from the right end.</li><li>Queue dequeue reads from the left end.</li><li>Return False at the first unequal pair; otherwise return True.</li></ol>',c:'is_palindrome(word):<br>    push/enqueue every letter<br>    while stack is not empty:<br>        right = stack.pop()<br>        left = queue.dequeue()<br>        if left != right: return False<br>    return True'},
{p:'Problem: derive operation cost from the physical work done by a list-based implementation.',o:'<ul><li><span class="term">Access index 0:</span> one direct access, O(1).</li><li><span class="term">Insert at index 0:</span> shift existing items right, O(n).</li><li><span class="term">Delete index 0:</span> shift remaining items left, O(n).</li><li><span class="term">Append:</span> normally no shift, O(1) amortized.</li></ul>',c:'stack push at front: list.insert(0, x)   # O(n)<br>stack pop at front:  del list[0]         # O(n)<br>queue enqueue:       list.append(x)      # O(1) average<br>queue dequeue:       del list[0]         # O(n)'},
{p:'A priority queue removes the most important item first. In this lab, a smaller number means higher priority; real applications may define priority differently.',o:'<ul><li><span class="term">enqueue(item, priority):</span> add an item and its priority.</li><li><span class="term">peek():</span> return the highest-priority item.</li><li><span class="term">dequeue():</span> remove that item.</li><li>If priorities tie, the earlier arrival leaves first.</li></ul>',c:'enqueue(item, priority):<br>    store item, priority, arrival_time<br><br>dequeue():<br>    find highest priority<br>    break a tie by earliest arrival<br>    remove and return that item'},
{p:'The ADT operations stay the same, but their Big-O costs depend on how the priority queue stores its items.',o:'<ul><li><span class="term">Unsorted list:</span> fast insertion, slow search/removal.</li><li><span class="term">Reverse-sorted list:</span> slow insertion, fast minimum removal from the end.</li><li><span class="term">Balanced BST:</span> both updates take O(log n) on average.</li></ul>',c:'Choose based on the workload:<br>many enqueues, few dequeues → unsorted list<br>few enqueues, many dequeues → sorted list<br>many of both → balanced tree<br><br>Always state storage orientation and assumptions.'},
{p:'Problem: provide FIFO queue behaviour using only LIFO stacks. IN collects new items; OUT supplies the oldest item.',o:'<ol><li>Enqueue pushes onto IN.</li><li>For dequeue, use OUT if it has an item.</li><li>If OUT is empty, move every item from IN to OUT.</li><li>The transfer reverses order, placing the oldest item on top of OUT.</li></ol>',c:'enqueue(x):<br>    IN.push(x)<br><br>dequeue():<br>    if OUT is empty:<br>        while IN is not empty:<br>            OUT.push(IN.pop())<br>    if OUT is empty: report underflow<br>    return OUT.pop()'}
];
$('content').innerHTML=modules.map((m,i)=>`<section class="lab" id="lab${i}"><div class="heading"><div><h2>${m[0]}</h2><p class="goal">Learning goal: ${m[2]}.</p></div><span class="tag">${m[1]}</span></div><div class="layout"><div class="panel stage">${m[3]}</div><aside class="panel">${m[4]}<button class="readmore" onclick="$('lesson${i}').scrollIntoView({behavior:'smooth'})">Full problem, operations, and pseudocode ↓</button></aside></div><section class="lesson" id="lesson${i}"><div class="lesson-grid"><div><h3>Problem and concept</h3><p>${details[i].p}</p></div><div><h3>Operations and reasoning</h3>${details[i].o}</div><div class="full"><h3>${[5,6,7,8,9,10,14].includes(i)?'Algorithm pseudocode':'How the operation connects to code'}</h3><div class="pseudo">${details[i].c}</div></div></div></section></section>`).join('');$('nav').innerHTML=modules.map((m,i)=>`<button onclick="showLab(${i})">${i+1}. ${m[0]}</button>`).join('');$('jump').innerHTML=modules.map((m,i)=>`<option value="${i}">${i+1}. ${m[0]}</option>`).join('');let active=0;function showLab(i){active=(i+modules.length)%modules.length;$$('.lab').forEach((x,k)=>x.classList.toggle('on',k===active));$$('#nav button').forEach((x,k)=>x.classList.toggle('primary',k===active));$('jump').value=active;window.scrollTo({top:0,behavior:'smooth'})}$('jump').onchange=e=>showLab(+e.target.value);showLab(0);
function drawItems(id,a,active=-1){$(id).innerHTML=a.length?a.map((v,i)=>`<div class="item${i===active?' active':''}">${v}</div>`).join(''):'<span class="empty">empty</span>'}function drawTokens(id,a,current=-1){$(id).innerHTML=a.length?a.map((v,i)=>`<span class="token${i===current?' current':''}">${v}</span>`).join(''):'<span class="empty">empty</span>'}
function adt(name){$('adtImpl').innerHTML=`<b>HIDDEN STORAGE</b>${name}`;$('adtStatus').textContent=`Client code remains s.push("kiwi"). Only the hidden storage changed to ${name}.`}
function accessShow(k){const cards=$$('#accessGrid .access-card');cards.forEach((card,i)=>{card.classList.toggle('selected',i===k);$$('.token',card).forEach(x=>x.classList.remove('current'))});const picks=[1,2,0,1],names=['A list can access any requested index. Here the client requested index 1.','The stack exposes only C, the top and most recently added item.','The queue exposes only A, the head and earliest added item.','Priority P1 is highest here, so that item is exposed even though it is in the middle.'];$$('.token',cards[k])[picks[k]].classList.add('current');$('accessStatus').textContent=names[k]}accessShow(1);
let S=[];function stackDraw(a=-1){drawItems('stackBox',S,a)}function stackReset(){S=['grape','orange'];stackDraw();$('stackStatus').textContent='grape entered first; orange is now on top.'}function stackPush(){const v=$('stackInput').value.trim()||'?';S.push(v);stackDraw(S.length-1);$('stackStatus').textContent=`push(${v}) put ${v} on top.`}function stackPeek(){if(!S.length)return $('stackStatus').textContent='The stack is empty.';stackDraw(S.length-1);$('stackStatus').textContent=`peek() returns ${S.at(-1)} without removing it.`}function stackPop(){if(!S.length)return $('stackStatus').textContent='Cannot pop an empty stack.';const v=S.pop();stackDraw();$('stackStatus').textContent=`pop() returned and removed ${v}.`}stackReset();
let Q=[];function queueDraw(a=-1){drawItems('queueBox',Q,a)}function queueReset(){Q=['grape','orange'];queueDraw();$('queueStatus').textContent='grape entered first, so it is at the head.'}function queueAdd(){const v=$('queueInput').value.trim()||'?';Q.push(v);queueDraw(Q.length-1);$('queueStatus').textContent=`enqueue(${v}) placed ${v} at the tail.`}function queuePeek(){if(!Q.length)return $('queueStatus').textContent='The queue is empty.';queueDraw(0);$('queueStatus').textContent=`peek() returns ${Q[0]} without removing it.`}function queueRemove(){if(!Q.length)return $('queueStatus').textContent='Cannot dequeue an empty queue.';const v=Q.shift();queueDraw();$('queueStatus').textContent=`dequeue() returned and removed ${v}.`}queueReset();
let CS=[],CQ=[];function compareDraw(){drawTokens('compareStack',CS);drawTokens('compareQueue',CQ)}function compareReset(){CS=['A','B','C'];CQ=['A','B','C'];compareDraw();$('compareStatus').textContent='Both receive A, then B, then C.';$('compareRule').textContent='Predict the first pair before clicking.'}function compareRemove(){if(!CS.length)return;const s=CS.pop(),q=CQ.shift();compareDraw();$('compareStatus').textContent=`Stack removes ${s}; queue removes ${q}.`;if(!CS.length)$('compareRule').innerHTML='<b>Orders:</b> stack C, B, A; queue A, B, C.'}compareReset();
let BT='',BI=0,BLast=-1,BS=[],BF=false;function braceDraw(){drawTokens('braceChars',[...BT],BLast);drawTokens('braceStack',BS)}function braceLoad(){BT=$('braceSelect').value;BI=0;BLast=-1;BS=[];BF=false;braceDraw();$('braceStatus').textContent='Start at the left. Click Next character to process one character.'}function braceStep(){if(BF)return;if(BI>=BT.length){$('braceStatus').textContent=BS.length?'Opening brace remains: NOT BALANCED.':'Empty stack at the end: BALANCED.';return}BLast=BI;const c=BT[BI];if(c==='{'){BS.push(c);$('braceStatus').textContent=`Character ${BI}: { is opening, so push it.`}else if(c==='}'){if(!BS.length){BF=true;$('braceStatus').textContent=`Character ${BI}: } appears while the stack is empty. NOT BALANCED.`}else{BS.pop();$('braceStatus').textContent=`Character ${BI}: } closes one earlier {, so pop.`}}else $('braceStatus').textContent=`Character ${BI}: ${c} is not a brace, so the stack does not change.`;BI++;braceDraw();if(BI===BT.length&&!BF)setTimeout(()=>{$('braceStatus').textContent=BS.length?'Scan finished, but an opening brace remains. NOT BALANCED.':'Scan finished with an empty stack. BALANCED.'},150)}braceLoad();
const callSteps=[[['f1(5)'],'f1 starts.'],[['f1(5)','f2(5)'],'f1 pauses; f2 is pushed.'],[['f1(5)','f2(5)','f3(5)'],'f2 pauses; f3 is pushed.'],[['f1(5)','f2(5)','f3(5)','f4(5)'],'f3 pauses; f4 is active.'],[['f1(5)','f2(5)','f3(5)'],'f4 returns 5 and is popped.'],[['f1(5)','f2(5)'],'f3 returns 10 and is popped.'],[['f1(5)'],'f2 returns 20 and is popped.'],[[],'f1 returns 40; the stack is empty.']];let CI=0;function callDraw(){const [a,t]=callSteps[CI];$('callBox').innerHTML=a.length?a.map((x,i)=>`<div class="frame${i===a.length-1?' active':''}">${x}${i===a.length-1?' · ACTIVE':' · waiting'}</div>`).join(''):'<span class="empty">empty · finished</span>';$('callStatus').textContent=t}function callStep(){if(CI<callSteps.length-1)CI++;callDraw()}function callReset(){CI=0;callDraw()}callReset();
let FP=[],FR=0;function fibDraw(){drawTokens('fibStack',FP);$('fibResult').textContent=`result = ${FR}`}function fibReset(){FP=[4];FR=0;fibDraw();$('fibStatus').textContent='Initial parameter 4 is on the stack.'}function fibStep(){if(!FP.length)return $('fibStatus').textContent=`Stack empty. fibonacci(4) = ${FR}.`;const n=FP.pop();if(n===0)$('fibStatus').textContent='Popped 0: add 0.';else if(n===1){FR++;$('fibStatus').textContent='Popped 1: add 1.'}else{FP.push(n-2,n-1);$('fibStatus').textContent=`Popped ${n}: push ${n-2} first, then ${n-1}.`}fibDraw();if(!FP.length)$('fibStatus').textContent+=` Final result: ${FR}.`}fibReset();
let SUMF=[],SUMNEXT=0,SUMPHASE='down',SUMRESULT=0;function sumDraw(){drawTokens('sumFrames',SUMF,SUMF.length-1);$('sumResult').textContent=SUMPHASE==='down'?'returned value = waiting':`returned value = ${SUMRESULT}`}function sumReset(){SUMF=[5];SUMNEXT=4;SUMPHASE='down';SUMRESULT=0;sumDraw();$('sumStatus').textContent='Called sum(5). It pauses and waits for sum(4).'}function sumStep(){if(SUMPHASE==='done')return $('sumStatus').textContent='Finished: sum(5) = 15.';if(SUMPHASE==='down'){SUMF.push(SUMNEXT);if(SUMNEXT===0){SUMPHASE='up';SUMRESULT=0;$('sumStatus').textContent='Reached base case: sum(0) returns 0. Now the stack will unwind.'}else{$('sumStatus').textContent=`Called sum(${SUMNEXT}). It pauses and waits for sum(${SUMNEXT-1}).`;SUMNEXT--}}else{const n=SUMF.pop();if(n===0)$('sumStatus').textContent='Pop sum(0): the base case returns 0.';else{const before=SUMRESULT;SUMRESULT=n+SUMRESULT;$('sumStatus').textContent=`Pop sum(${n}): ${n} + ${before} = ${SUMRESULT}.`}if(!SUMF.length){SUMPHASE='done';$('sumStatus').textContent+=' The original call is complete.'}}sumDraw()}sumReset();
let FACF=[],FACNEXT=0,FACPHASE='down',FACRESULT=1;function factorialDraw(){drawTokens('factorialFrames',FACF,FACF.length-1);$('factorialResult').textContent=FACPHASE==='down'?'returned value = waiting':`returned value = ${FACRESULT}`}function factorialReset(){FACF=[5];FACNEXT=4;FACPHASE='down';FACRESULT=1;factorialDraw();$('factorialStatus').textContent='Called factorial(5). It pauses and waits for factorial(4).'}function factorialStep(){if(FACPHASE==='done')return $('factorialStatus').textContent='Finished: factorial(5) = 120.';if(FACPHASE==='down'){FACF.push(FACNEXT);if(FACNEXT===1){FACPHASE='up';FACRESULT=1;$('factorialStatus').textContent='Reached base case: factorial(1) returns 1. Now the stack will unwind.'}else{$('factorialStatus').textContent=`Called factorial(${FACNEXT}). It pauses and waits for factorial(${FACNEXT-1}).`;FACNEXT--}}else{const n=FACF.pop();if(n===1)$('factorialStatus').textContent='Pop factorial(1): the base case returns 1.';else{const before=FACRESULT;FACRESULT=n*FACRESULT;$('factorialStatus').textContent=`Pop factorial(${n}): ${n} × ${before} = ${FACRESULT}.`}if(!FACF.length){FACPHASE='done';$('factorialStatus').textContent+=' The original call is complete.'}}factorialDraw()}factorialReset();
let PW='',PS=[],PQ=[],PF=false;function palDraw(){drawTokens('palStack',PS);drawTokens('palQueue',PQ)}function palLoad(){PW=$('palSelect').value;PS=[...PW];PQ=[...PW];PF=false;palDraw();$('palCheck').textContent='?';$('palStatus').textContent='Predict the first pair.'}function palStep(){if(PF)return;if(!PS.length){$('palCheck').textContent='✓ PALINDROME';return}const r=PS.pop(),l=PQ.shift();palDraw();if(l!==r){PF=true;$('palCheck').textContent='✗ NOT A PALINDROME';$('palStatus').textContent=`Queue gave ${l}; stack gave ${r}.`}else{$('palCheck').textContent=`${l} = ${r}`;$('palStatus').textContent='The pair matches.';if(!PS.length)setTimeout(()=>{$('palCheck').textContent='✓ PALINDROME';$('palStatus').textContent='Every pair matched.'},150)}}palLoad();
const SA=['A','B','C','D'];function shiftDraw(values=SA,m=[],direction=''){ $('shiftArray').innerHTML=values.map((x,i)=>`<div class="cell${m.includes(i)?' '+direction:''}">${x}<span class="idx">index ${i}</span></div>`).join('')}function shiftReset(){shiftDraw();$('shiftCount').textContent='Start: [A, B, C, D]';$('shiftStatus').textContent='Choose an operation to see the resulting list and the moved items.'}function shiftDemo(t){if(t==='add'){shiftDraw(['X',...SA],[1,2,3,4],'move-right');$('shiftCount').textContent='Result: [X, A, B, C, D]';$('shiftStatus').textContent='A, B, C, and D shift right to create index 0: O(n).'}if(t==='del'){shiftDraw(['B','C','D'],[0,1,2],'move-left');$('shiftCount').textContent='Result: [B, C, D]';$('shiftStatus').textContent='A is removed. B, C, and D shift left to close the gap: O(n).'}if(t==='end'){shiftDraw([...SA,'E']);$('shiftCount').textContent='Result: [A, B, C, D, E]';$('shiftStatus').textContent='E is appended after D. Existing items do not shift: O(1) on average.'}}shiftReset();
let P=[],PA=0;function pqSorted(){return [...P].sort((a,b)=>a.p-b.p||a.a-b.a)}function pqDraw(){const a=pqSorted();$('pqBox').innerHTML=a.length?a.map((x,i)=>`<div class="item${i===0?' active':''}">${x.n}<span class="priority">priority ${x.p}</span></div>`).join(''):'<span class="empty">empty</span>'}function pqReset(){P=[];PA=0;[['Email',4],['Alarm',1],['Report',3]].forEach(([n,p])=>P.push({n,p,a:PA++}));pqDraw();$('pqStatus').textContent='Alarm arrived second but leaves first because priority 1 is highest.'}function pqAdd(){const n=$('pqName').value.trim()||'item',p=Math.max(1,Math.min(9,+$('pqPriority').value||1));P.push({n,p,a:PA++});pqDraw();$('pqStatus').textContent=`${n} entered with priority ${p}.`}function pqPeek(){if(!P.length)return $('pqStatus').textContent='Empty priority queue.';const x=pqSorted()[0];$('pqStatus').textContent=`peek() returns ${x.n}, priority ${x.p}, without removal.`}function pqRemove(){if(!P.length)return $('pqStatus').textContent='Empty priority queue.';const x=pqSorted()[0];P.splice(P.indexOf(x),1);pqDraw();$('pqStatus').textContent=`dequeue() removed ${x.n}, the highest-priority item.`}pqReset();
const implText=['Unsorted: enqueue is immediate. Dequeue searches up to n items for the minimum.','Reverse sorted: enqueue finds a position and shifts items. The minimum is at the end, so dequeue is O(1).','Balanced BST: insertion and removal follow about log n levels on average.'];function implShow(i){$$('#pqTable tbody tr').forEach((r,k)=>r.classList.toggle('active',k===i));$('implStatus').textContent=implText[i]}implShow(0);
let TI=[],TO=[],TN=68;function twoDraw(){drawTokens('twoIn',TI);drawTokens('twoOut',TO)}function twoReset(){TI=['A','B','C'];TO=[];TN=68;twoDraw();$('twoStatus').textContent='A entered first, then B, then C. Top is on the right.'}function twoEnqueue(){const x=String.fromCharCode(TN++);TI.push(x);twoDraw();$('twoStatus').textContent=`Enqueued ${x} by pushing it onto the top of IN.`}function twoDequeue(){if(!TO.length&&TI.length){while(TI.length)TO.push(TI.pop());twoDraw();$('twoStatus').textContent='OUT was empty, so all items transferred. Order reversed; the oldest item is now on top.';return}if(TO.length){const x=TO.pop();twoDraw();$('twoStatus').textContent=`Popped ${x} from OUT, correctly removing the oldest item.`;return}$('twoStatus').textContent='The queue is empty.'}twoReset();document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.key==='ArrowRight')showLab(active+1);if(e.key==='ArrowLeft')showLab(active-1)});
